{% extends "base.html" %}{% block content %}<div class="col-md-6 mx-auto"><h2>Create account</h2>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input class="form-control mb-2" name="full_name" placeholder="Full name" value="{{ f.get('full_name','') }}" required>
<input class="form-control mb-2" type="email" name="email" placeholder="Email" value="{{ f.get('email','') }}" required>
<input class="form-control mb-2" name="phone" inputmode="numeric" placeholder="Mobile number" value="{{ f.get('phone','') }}" required>
<input class="form-control mb-2" name="line1" placeholder="Delivery address" value="{{ f.get('line1','') }}" required>
<div class="row g-2 mb-2"><div class="col"><input class="form-control" name="city" placeholder="City" value="{{ f.get('city','') }}" required></div>
<div class="col"><input class="form-control" name="pincode" inputmode="numeric" maxlength="6" placeholder="Pincode" value="{{ f.get('pincode','') }}" required></div></div>
<input class="form-control mb-3" type="password" name="password" placeholder="Password (min 8 characters)" required>
<button class="btn btn-choc w-100">Register</button></form></div>{% endblock %}
